# ── Shared config ─────────────────────────────────────────────────────────────
x-model-env: &model-env
  MODEL_BASE_URL: http://ollama:11434/v1
  MODEL_API_KEY: none
  MODEL_NAME: qwen2.5-coder:7b
  SECONDARY_BASE_URL: http://ollama:11434/v1
  SECONDARY_API_KEY: none
  SECONDARY_MODEL: llama3.2:3b
  MAX_TOKENS_GENERATOR: "512"
  MAX_TOKENS_JUDGE: "200"
  NUM_CTX: "4096"
  MAX_WORKERS: "4"
  REQUEST_TIMEOUT_SEC: "120"
  WINMERGE_REPO_PATH: /app/winmerge
  MLFLOW_TRACKING_URI: http://mlflow:5000
  METRICS_DB_PATH: /app/reports/metrics.db
  DRY_RUN: "0"
  USE_DENSE: "1"
  EMBEDDING_MODEL: intfloat/multilingual-e5-base
  EMBEDDING_DEVICE: cpu
  BM25_MIN_SCORE: "15"

services:

  # ── Model server (GPU required) ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Pulls both models; exits when done
  model-init:
    image: python:3.11-slim
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - python3
      - -c
      - |
        import urllib.request, json
        for model in ["qwen2.5-coder:7b", "llama3.2:3b"]:
            print(f"Pulling {model}...", flush=True)
            req = urllib.request.Request(
                "http://ollama:11434/api/pull",
                data=json.dumps({"name": model, "stream": False}).encode(),
                headers={"Content-Type": "application/json"},
            )
            urllib.request.urlopen(req, timeout=1800)
            print(f"{model} ready.", flush=True)
    restart: "no"

  # ── Experiment tracking ───────────────────────────────────────────────────────
  mlflow:
    build:
      context: docker
      dockerfile: mlflow.Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns
    command: >
      server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Initialises empty DB schema so Grafana never 500s on first launch
  db-seed:
    image: python:3.11-slim
    depends_on:
      model-init:
        condition: service_completed_successfully
    volumes:
      - ./reports:/reports
    command:
      - python3
      - -c
      - |
        import sqlite3, pathlib
        db = pathlib.Path("/reports/metrics.db")
        db.parent.mkdir(parents=True, exist_ok=True)
        con = sqlite3.connect(db)
        con.executescript("""
            CREATE TABLE IF NOT EXISTS runs (
                run_id TEXT PRIMARY KEY, timestamp TEXT, model_name TEXT,
                top_k INTEGER, dry_run INTEGER, winmerge_commit TEXT,
                composite_score REAL, pass_rate REAL, mean_correctness REAL,
                mean_faithfulness REAL, evidence_recall REAL,
                hallucination_rate REAL, false_refusal_rate REAL,
                false_answer_rate REAL, forbidden_claim_rate REAL,
                detected_refusal_rate REAL,
                cohens_kappa_correctness REAL, cohens_kappa_faithfulness REAL,
                n_cases INTEGER
            );
            CREATE TABLE IF NOT EXISTS cases (
                id INTEGER PRIMARY KEY AUTOINCREMENT, run_id TEXT,
                case_id TEXT, language TEXT, difficulty TEXT,
                should_have_answer INTEGER, correctness REAL,
                faithfulness REAL, relevance REAL, passed INTEGER,
                hallucination INTEGER, false_refusal INTEGER,
                false_answer INTEGER, evidence_hit INTEGER,
                forbidden_claim_hit INTEGER, is_refusal INTEGER,
                secondary_correctness REAL, secondary_faithfulness REAL
            );
        """)
        con.commit()
        con.close()
        print("DB schema ready.", flush=True)
    restart: "no"

  # ── Dashboards ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
      - ./reports:/reports:ro
    depends_on:
      mlflow:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Evaluation runner (on-demand) ─────────────────────────────────────────────
  rag-eval:
    build: .
    environment:
      <<: *model-env
    volumes:
      # Mount source over the baked copy so code edits take effect WITHOUT a rebuild.
      # (Rebuild is still required when dependencies in requirements*.txt change.)
      - ./rag_eval:/app/rag_eval:ro
      - ./data:/app/data:ro
      - ./reports:/app/reports
      - ./winmerge:/app/winmerge:ro
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    profiles:
      - eval

volumes:
  ollama_data:
  mlruns:
  grafana_data:
